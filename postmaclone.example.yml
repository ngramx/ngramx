# Factory config for nightly anonymized artifact production.
# Lives in the dedicated factory repo (not an app checkout):
#   https://github.com/gigabyte-software/postmaclone-factory
# Discover as postmaclone.yml / .yaml.
#
#   ngramx postmaclone produce --all
#   ngramx postmaclone produce --dataset earl-kendrick
#   ngramx init-postmaclone-workflow --dataset earl-kendrick
#
# GitHub Actions runners have ~14GB disk — too small to restore multi‑GB dumps locally.
# Use target.provider: remote so restore + anonymize run on a DO Managed Database scratch DB.
# After publish, shared.* refreshes the long-lived hosted copy developers connect to.
#
# Connection details (server, port, username, password, SSL) live once per engine under
# engines.* — datasets only name their scratch/anon databases.

version: "1"
locale: en_GB
seed: 42

engines:
  postgres:
    scratch:
      credentials:
        server: "op://Tech Team Vault/postmaclone-scratch-psql/server"
        port: "op://Tech Team Vault/postmaclone-scratch-psql/port"
        username: "op://Tech Team Vault/postmaclone-scratch-psql/username"
        password: "op://Tech Team Vault/postmaclone-scratch-psql/password"
        connection_options: "op://Tech Team Vault/postmaclone-scratch-psql/connection options"
    anon:
      credentials:
        server: "op://Tech Team Vault/postmaclone-anon-psql/server"
        port: "op://Tech Team Vault/postmaclone-anon-psql/port"
        username: "op://Tech Team Vault/postmaclone-anon-psql/username"
        password: "op://Tech Team Vault/postmaclone-anon-psql/password"
        connection_options: "op://Tech Team Vault/postmaclone-anon-psql/connection options"
  # mysql:
  #   scratch:
  #     credentials: { ... postmaclone-scratch-mysql ... }
  #   anon:
  #     credentials: { ... postmaclone-anon-mysql ... }

datasets:
  earl-kendrick:
    engine: postgres
    backup:
      source: s3
      path: "spaces://weathered-brook-object-storage/database-backups/all/"
      file: "earl_kendrick_prod.sql.gz"
      region: lon1
      endpoint: "https://lon1.digitaloceanspaces.com"
      credentials:
        key: "op://Tech Team Vault/ngramx-db-backup-read-access/username"
        secret: "op://Tech Team Vault/ngramx-db-backup-read-access/password"
    publish:
      path: "spaces://weathered-brook-anonymized-backups/earl-kendrick/"
      file: "earl_kendrick_anon.sql.gz"
      region: lon1
      endpoint: "https://lon1.digitaloceanspaces.com"
      credentials:
        key: "op://Tech Team Vault/ngramx-anon-backup-write/username"
        secret: "op://Tech Team Vault/ngramx-anon-backup-write/password"
    # Keep artifacts smaller than prod for the 57GB class of dumps:
    # include_tables: [users, orders, order_items]
    # exclude_tables: [audit_log, sessions, job_batches]
    target:
      provider: remote
      remote:
        database: earl_kendrick_core_prod_scratch
    shared:
      database: earl_kendrick_core_prod_anon
      password_rotation_days: 7   # default; set 0 to disable
    tables:
      users:
        email: uniqueSafeEmail
        first_name: firstName
        last_name: lastName
