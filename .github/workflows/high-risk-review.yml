# Generated by: ngramx init-github-actions
# Calls reusable workflow: gigabyte-software/shared-workflows @ main
#
# On a pull request into main, the shared workflow asks Claude to
# apply one risk label (risk:low, risk:medium, or risk:high).
# risk:high disables GitHub auto-merge and removes `auto-merge`.
# The job then fails until the pull request has one approving review. Submitting
# or dismissing a review re-runs the check: one approval (including the author's)
# turns it green, and dismissing that approval turns it red again. Every other
# risk passes with no review.
#
# GitHub rulesets cannot require an approval just because a label is present.
# Make this job a required status check on main and do not require
# approving reviews for every PR. Add the check only after this file is on the
# default branch. Until then the check never runs and a required-check rule
# would block every merge.
#
# Required secret (org or repo), passed with secrets: inherit:
#   ANTHROPIC_API_KEY

name: high-risk-review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
    branches:
      - 'main'
  pull_request_review:
    types: [submitted, dismissed]
    branches:
      - 'main'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  high-risk-review:
    uses: gigabyte-software/shared-workflows/.github/workflows/high-risk-review.yml@main
    secrets: inherit
    with:
      risk-low-label: 'risk:low'
      risk-high-label: 'risk:high'
      auto-merge-label: 'auto-merge'
