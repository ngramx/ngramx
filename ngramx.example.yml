version: "1.0"

docker:
  compose_file: "docker-compose.yml"
  primary_service: "app"
  wait_for:
    - service: "db"
      timeout: 60
    - service: "redis"
      timeout: 30
    # Real readiness probe for the app: tried in order healthcheck ->
    # ready_command -> ready_log. Falls back to "running" if none are set.
    - service: "app"
      timeout: 300
      healthcheck: true
      ready_command: "php artisan --version"
      ready_log: "is ready!"

setup:
  pre_start:
    - command: "[ ! -f .env ] && cp .env.example .env || true"
      description: "Create environment file if it doesn't exist"
      ignore_failure: true
      
  initialize:
    - command: "composer install --no-interaction"
      description: "Install PHP dependencies"
      retry: 2
      timeout: 300
      
    - command: "php artisan migrate:fresh --seed --force"
      description: "Setup database"
      ignore_failure: false

commands:
  test:
    command: "php artisan test"
    description: "Run test suite"
    
  shell:
    command: "bash"
    description: "Open shell in container"
    
  fresh_db:
    command: "php artisan migrate:fresh --seed"
    description: "Reset database with fresh data"

  # Providing a list under `command:` runs every entry CONCURRENTLY inside the
  # container (this is the default). A live panel shows `<label>: <last log
  # line>` for each running command; each row disappears when that command
  # finishes. The overall command succeeds only if all sub-commands succeed.
  #
  # Only use the parallel (default) form for INDEPENDENT commands. If the steps
  # depend on each other — e.g. install deps, then migrate, then clear caches —
  # set `parallel: false` so they run one at a time in order (see `fresh` below).
  validate:
    command:
      - "composer validate --strict"
      - "vendor/bin/phpstan analyse src tests --level=8"
      - "vendor/bin/phpunit"
    description: "Run composer, phpstan and phpunit in parallel"
    timeout: 180

  # `parallel: false` runs the list SEQUENTIALLY, stopping at the first failure.
  # Use this whenever steps have ordering dependencies. Running these
  # concurrently races (e.g. `cache:clear` on the database driver hits a
  # "relation \"cache\" does not exist" error while `migrate:fresh` is mid-flight
  # dropping/recreating tables, and a build can fail against half-installed deps).
  fresh:
    command:
      - "composer install --no-interaction"
      - "npm install && npm run build"
      - "php artisan migrate:fresh --seed --force"
      - "php artisan optimize:clear"
    description: "Install deps, build assets, rebuild the database, clear caches"
    parallel: false
    timeout: 600

# Optional: Post Maclone — ephemeral anonymized DB clones for safe bug RCA.
# Only columns listed under tables: are rewritten (opt-in). All other columns
# are left unchanged. Prefer `ngramx postmaclone down` when finished.
#
# Connection-string source (MySQL example): declare source: connection in YAML;
# put the URL (with credentials) only in `.env` / `.env.postmaclone`:
#   POSTMACLONE_SOURCE_URL=mysql://readonly:secret@host:3306/dbname
# Then run `ngramx postmaclone` (or pass `--from 'mysql://…'` to override).
#
# postmaclone:
#   engine: mysql                 # or postgres / mariadb; auto-detected from compose if omitted
#   locale: en_GB
#   seed: 42
#   backup:
#     source: connection          # URL from POSTMACLONE_SOURCE_URL — not path/credentials here
#   target:
#     provider: docker
#     ttl_hours: 4
#     docker:
#       image: mysql:8.0
#   tables:
#     users:
#       email: uniqueSafeEmail
#       first_name: firstName
#       last_name: lastName
#
# # Dump / S3 source alternative:
# postmaclone:
#   engine: postgres
#   locale: en_GB
#   seed: 42
#   backup:
#     source: local               # local | s3 | connection
#     path: "./backups/latest.dump"
#     # DigitalOcean Spaces — shared daily Forge folders contain every project's dump.
#     # Newest dated folder is auto-picked; the dump basename is project-specific.
#     # Credentials: Tech Team Vault → ngramx-db-backup-read-access (op:// refs are safe to commit)
#     #   Humans: 1Password app CLI integration (or eval $(op signin))
#     #   Agents/CI: OP_SERVICE_ACCOUNT_TOKEN — see README Post Maclone section
#     #   ngramx postmaclone doctor
#     # source: s3
#     # path: "spaces://weathered-brook-object-storage/database-backups/all/"
#     # file: "earl_kendrick_prod.sql.gz"
#     # Or: path: "spaces://…/database-backups/all/*/earl_kendrick_prod.sql.gz"
#     # region: lon1
#     # endpoint: "https://lon1.digitaloceanspaces.com"
#     # credentials:
#     #   key: "op://Tech Team Vault/ngramx-db-backup-read-access/username"
#     #   secret: "op://Tech Team Vault/ngramx-db-backup-read-access/password"
#     # (prod roles/ACLs are stripped on restore — no backup.roles needed)
#
#   # Prefer a nightly factory prebuilt for multi‑GB DBs (restore-only; no local anonymize).
#   # Factory produce writes latest.json next to the artifact — omit file to follow the manifest.
#   # Escape hatch: ngramx postmaclone --from-prod
#   # prebuilt:
#   #   source: s3
#   #   path: "spaces://weathered-brook-anonymized-backups/earl-kendrick/"
#   #   file: "earl_kendrick_anon.sql.gz"
#   #   max_age_hours: 36
#   #   region: lon1
#   #   endpoint: "https://lon1.digitaloceanspaces.com"
#   #   credentials:
#   #     key: "op://Tech Team Vault/ngramx-anon-backup-read/username"
#   #     secret: "op://Tech Team Vault/ngramx-anon-backup-read/password"
#
#   target:
#     provider: auto              # neon | docker | remote | auto (Postgres: Neon if NEON_API_KEY is set, else Docker)
#     ttl_hours: 4                # safety-net expiry; tear down with `postmaclone down`
#     # Large prebuilts: restore into a fresh in-region DO/Neon URL (not a shared staging DB)
#     # remote:
#     #   url: "op://Tech Team Vault/postmaclone-remote/database_url"
#     # remote_threshold_bytes: 2147483648
#   tables:                       # optional when only using prebuilt
#     users:
#       email: uniqueSafeEmail
#       first_name: firstName
#       last_name: lastName
#       # Chain formatters + literals:
#       # address_line_1: "{{numberBetween(1, 999)}} {{firstName}} Street"
#       # address_line_1: 'numberBetween(1, 999) + " " + firstName + " Street"'
#       # omit non-PII columns — they stay as-is

# Optional: control where Ngramx writes its managed agent instructions and skills.
# `ngramx sync-agents` (and `ngramx up`) regenerate these from the bundled templates.
# Both `targets` (rules) and `skills` respect the lists below — omit the whole
# `agents:` block to accept the defaults shown here.
agents:
  # Where the managed rule/instruction content is written.
  # Valid: agents_md, cursor_rules, claude_md, copilot_instructions
  # Default: [agents_md, cursor_rules]
  targets:
    - agents_md             # AGENTS.md (managed block, read by most agents)
    - cursor_rules          # .cursor/rules/ngramx.mdc
    - claude_md             # CLAUDE.md (add this to distribute rules to Claude)
    - copilot_instructions  # .github/copilot-instructions.md

  # Where skill folders (start-ticket, create-pr, …) are copied.
  # Valid: cursor, claude
  # Default: [cursor]
  skills:
    - cursor                # .cursor/skills/<name>/SKILL.md
    - claude                # .claude/skills/<name>/SKILL.md

# Optional: event hooks — host commands that run after ngramx lifecycle events.
# Prefer putting personal defaults in ~/.ngramx.yaml; use this block (or
# .ngramx/config.yaml) for project-specific overrides. Sources deep-merge with
# precedence: ~/.ngramx.yaml < .ngramx/config.yaml < ngramx.yml hooks.
#
# Placeholders: {worktree_path}, {path}, {branch}, {ticket}, {ticket_slug},
# {url}, {repository_path}, {folder}, {project_path}
